<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Zenbo Command History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/liff/liff-config.js"></script>
  <script src="/liff/liff.js"></script>
  <script src="/liff/shared/zenbo-common.js"></script>
  <style>
    html { background: #020617; }
    body { font-family: 'Prompt', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  </style>
</head>
<body class="min-h-screen bg-slate-950 font-sans text-white pb-20">
  <header class="sticky top-0 z-20 border-b border-slate-800 bg-slate-900/95 px-4 py-3 backdrop-blur">
    <div class="mx-auto flex max-w-2xl items-center justify-between gap-3">
      <a href="/liff/" class="inline-flex min-h-11 items-center rounded-lg px-2 text-sm font-bold text-slate-100 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-300"><i class="fa-solid fa-chevron-left mr-2 text-slate-400" aria-hidden="true"></i>หน้าหลัก</a>
      <a href="/liff/command/" class="inline-flex min-h-11 items-center rounded-lg bg-violet-700 px-3 text-xs font-bold text-white hover:bg-violet-600 focus:outline-none focus:ring-2 focus:ring-violet-300"><i class="fa-solid fa-wand-magic-sparkles mr-1.5" aria-hidden="true"></i>สั่งด้วยคำพูด</a>
    </div>
  </header>
  <div id="user-profile-bar" class="mx-auto flex max-w-2xl justify-end px-4 pt-2"></div>

  <main class="mx-auto max-w-2xl p-4 pb-10">
    <section class="rounded-2xl border border-slate-800 bg-slate-900 p-4 shadow-xl" aria-labelledby="history-title">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 id="history-title" class="text-lg font-bold"><i class="fa-solid fa-clock-rotate-left mr-2 text-emerald-400" aria-hidden="true"></i>ประวัติคำสั่ง Zenbo</h1>
          <p class="mt-1 text-xs leading-relaxed text-slate-400">แสดงเวลาที่ Gateway รับคำสั่งและส่ง MQTT แล้ว ไม่ใช่หลักฐานว่าหุ่นยนต์ทำงานเสร็จ</p>
        </div>
        <button id="refresh" type="button" class="min-h-11 rounded-xl bg-slate-700 px-3 text-xs font-bold hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-300"><i class="fa-solid fa-rotate mr-1.5" aria-hidden="true"></i>รีเฟรช</button>
      </div>
      <label for="robot-filter" class="mt-4 block text-xs font-semibold text-slate-300">กรอง Zenbo</label>
      <select id="robot-filter" class="mt-2 min-h-12 w-full rounded-xl border border-slate-700 bg-slate-950 px-3 text-sm text-white focus:border-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-300">
        <option value="">ทุก Zenbo</option>
      </select>
      <p id="history-status" class="mt-3 min-h-5 text-xs text-slate-400" role="status" aria-live="polite">กำลังโหลดประวัติ...</p>
    </section>

    <section class="mt-4" aria-label="รายการประวัติคำสั่ง">
      <ol id="history-list" class="space-y-3"></ol>
      <nav id="history-pagination" class="mt-4 hidden items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-900 p-3" aria-label="แบ่งหน้าประวัติคำสั่ง">
        <button id="previous-page" type="button" class="min-h-11 rounded-lg border border-slate-700 px-3 text-xs font-bold text-slate-100 hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-40 focus:outline-none focus:ring-2 focus:ring-emerald-300"><i class="fa-solid fa-chevron-left mr-1.5" aria-hidden="true"></i>ก่อนหน้า</button>
        <p id="page-summary" class="text-center text-xs font-semibold text-slate-300" aria-live="polite"></p>
        <button id="next-page" type="button" class="min-h-11 rounded-lg border border-slate-700 px-3 text-xs font-bold text-slate-100 hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-40 focus:outline-none focus:ring-2 focus:ring-emerald-300">ถัดไป<i class="fa-solid fa-chevron-right ml-1.5" aria-hidden="true"></i></button>
      </nav>
    </section>
  </main>

  <!-- Sticky Bottom Navigation Bar for Mobile -->
  <nav aria-label="แถบเมนูล่าง" class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 px-4 py-2 flex items-center justify-around max-w-lg mx-auto shadow-2xl">
    <a href="/liff/" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-300 text-[10px] font-medium transition">
      <div class="grid h-8 w-8 place-items-center rounded-xl bg-slate-800/80 border border-slate-700/60">
        <i class="fa-solid fa-house text-sm"></i>
      </div>
      <span>หน้าหลัก</span>
    </a>
    <a href="/liff/control/" class="flex flex-col items-center gap-1 text-slate-400 hover:text-blue-300 text-[10px] font-medium transition">
      <div class="grid h-8 w-8 place-items-center rounded-xl bg-slate-800/80 border border-slate-700/60">
        <i class="fa-solid fa-gamepad text-sm"></i>
      </div>
      <span>จอยสติ๊ก</span>
    </a>
    <a href="/liff/scenario/" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-300 text-[10px] font-medium transition">
      <div class="grid h-8 w-8 place-items-center rounded-xl bg-slate-800/80 border border-slate-700/60">
        <i class="fa-solid fa-wand-sparkles text-sm"></i>
      </div>
      <span>สถานการณ์</span>
    </a>
    <a href="/liff/command/" class="flex flex-col items-center gap-1 text-slate-400 hover:text-violet-300 text-[10px] font-medium transition">
      <div class="grid h-8 w-8 place-items-center rounded-xl bg-slate-800/80 border border-slate-700/60">
        <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
      </div>
      <span>สั่งงาน AI</span>
    </a>
    <a href="/liff/history/" class="flex flex-col items-center gap-1 text-amber-400 text-[10px] font-semibold">
      <div class="grid h-8 w-8 place-items-center rounded-xl bg-amber-950/80 border border-amber-500/40 shadow-sm">
        <i class="fa-solid fa-clock-rotate-left text-sm"></i>
      </div>
      <span>ประวัติ</span>
    </a>
  </nav>

  <script>
    const API_BASE = `${window.location.origin}${window.ZENBO_LIFF_CONFIG?.apiBase || ''}`;
    window.ZenboLiff.init();
    if (typeof ZenboCommon !== 'undefined') {
      ZenboCommon.ensureAuth().then(() => ZenboCommon.refreshUser().then(() => {
        ZenboCommon.applyRoleGating();
        ZenboCommon.renderUserBar('user-profile-bar');
      }));
    }
    const historyList = document.getElementById('history-list');
    const historyStatus = document.getElementById('history-status');
    const robotFilter = document.getElementById('robot-filter');
    const pagination = document.getElementById('history-pagination');
    const previousPage = document.getElementById('previous-page');
    const nextPage = document.getElementById('next-page');
    const pageSummary = document.getElementById('page-summary');
    const pageSize = 20;
    const initialQuery = new URLSearchParams(window.location.search);
    let currentPage = Math.max(1, Number.parseInt(initialQuery.get('page') || '1', 10) || 1);
    const initialRobotSlug = initialQuery.get('robot_slug') || '';
    if (initialRobotSlug) {
      const option = document.createElement('option');
      option.value = initialRobotSlug;
      option.textContent = initialRobotSlug;
      robotFilter.appendChild(option);
      robotFilter.value = initialRobotSlug;
    }

    function summarize(payload) {
      if (payload.emergency) return 'หยุดฉุกเฉิน';
      if (payload.text) return `พูด: ${payload.text}`;
      if (payload.remote_control) return `จอย: ${payload.remote_control.body || payload.remote_control.head || 'STOP'}`;
      if (payload.wheel_lights) return `ไฟล้อ: ${payload.wheel_lights.mode || 'breathing'} ${payload.wheel_lights.color || ''}`;
      if (payload.youtube) return 'เปิด YouTube และเต้น';
      if (payload.action) return payload.action.stop ? 'หยุด action' : `ท่าทาง: ${payload.action.action_id}`;
      if (payload.motion) return 'เคลื่อนที่';
      if (payload.head || payload.head_sequence) return 'ขยับศีรษะ';
      if (payload.face) return `สีหน้า: ${payload.face}`;
      if (payload.behavior) return `พฤติกรรม: ${payload.behavior.action}`;
      if (payload.vision) return `Vision: ${payload.vision.action}`;
      return 'คำสั่ง Zenbo';
    }

    const motionLabels = {MQTT_PUBLISHED: 'Gateway ส่ง MQTT แล้ว', ACCEPTED: 'Gateway รับคำสั่งแล้ว',
      APK_RECEIVED: 'APK รับคำสั่งแล้ว', SDK_SUBMITTED: 'ส่งเข้า SDK แล้ว', REJECTED: 'ปฏิเสธคำสั่ง',
      SDK_STOP_REQUESTED: 'ร้องขอหยุดผ่าน SDK แล้ว', STOP_PUBLISHED: 'ส่งคำสั่งหยุดแล้ว'};

    function addCommandTrace(row, robotSlug, commandId) {
      if (!robotSlug || !commandId) return;
      const details = document.createElement('details');
      details.className = 'mt-3 border-t border-slate-800 pt-3 text-xs text-slate-300';
      const summary = document.createElement('summary');
      summary.className = 'cursor-pointer py-2 text-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-300';
      summary.textContent = 'ดูลำดับการรับคำสั่ง';
      const content = document.createElement('div');
      content.setAttribute('aria-live', 'polite');
      details.append(summary, content);
      let loaded = false;
      let loading = false;
      details.addEventListener('toggle', async () => {
        if (!details.open || loaded || loading) return;
        loading = true;
        content.textContent = 'กำลังโหลดลำดับคำสั่ง...';
        try {
          const response = await fetch(`${API_BASE}/api/v1/robots/${encodeURIComponent(robotSlug)}/commands/${encodeURIComponent(commandId)}/trace`);
          if (!response.ok) throw new Error(response.status === 404 ? 'ยังไม่พบข้อมูลคำสั่ง' : `HTTP ${response.status}`);
          const trace = await response.json();
          content.textContent = '';
          const note = document.createElement('p');
          note.className = 'my-2 text-slate-400';
          note.textContent = 'เรียงตามเวลาที่ Gateway บันทึก ไม่ใช่หลักฐานว่าหุ่นเคลื่อนที่หรือหยุดจริง';
          content.appendChild(note);
          const events = document.createElement('ol');
          events.className = 'space-y-2';
          (trace.events || []).forEach(event => {
            const entry = document.createElement('li');
            const ack = event.payload?.acknowledgement;
            const reason = ack?.reject_reason || ack?.stop_reason;
            entry.textContent = `${new Date(event.created_at_ms).toLocaleTimeString('th-TH')} · ${motionLabels[event.status] || event.status}${reason ? ' · ' + reason : ''}`;
            events.appendChild(entry);
          });
          content.appendChild(events);
          if (trace.events_truncated) {
            const truncated = document.createElement('p');
            truncated.className = 'mt-2 text-amber-300';
            truncated.textContent = 'แสดงเฉพาะ 100 เหตุการณ์ล่าสุดของคำสั่งนี้';
            content.appendChild(truncated);
          }
          loaded = true;
        } catch (error) {
          content.textContent = `โหลดไม่สำเร็จ: ${error.message} — ปิดแล้วเปิดอีกครั้งเพื่อลองใหม่`;
        } finally { loading = false; }
      });
      row.appendChild(details);
    }

    function render(items) {
      if (!items.length) {
        historyList.innerHTML = '<li class="rounded-2xl border border-dashed border-slate-700 p-6 text-center text-sm text-slate-400">ยังไม่มีคำสั่งที่บันทึกไว้</li>';
        return;
      }
      historyList.innerHTML = '';
      items.forEach(item => {
        const row = document.createElement('li');
        row.className = 'rounded-2xl border border-slate-800 bg-slate-900 p-4';
        const time = new Date(item.created_at_ms).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'medium' });
        const latency = item.accepted_latency_ms == null ? '—' : `${item.accepted_latency_ms} ms`;
        row.innerHTML = `<div class="flex flex-wrap items-start justify-between gap-2"><div><p class="text-sm font-bold text-slate-100"></p><p class="mt-1 text-[11px] text-slate-400"></p></div><span class="rounded-full border px-2 py-1 text-[10px] font-bold"></span></div><dl class="mt-3 grid grid-cols-2 gap-2 border-t border-slate-800 pt-3 text-[11px]"><div><dt class="text-slate-500">Zenbo</dt><dd class="mt-0.5 break-all text-slate-200"></dd></div><div><dt class="text-slate-500">Gateway รับคำสั่ง</dt><dd class="mt-0.5 text-slate-200"></dd></div><div><dt class="text-slate-500">Surface</dt><dd class="mt-0.5 text-slate-200"></dd></div><div><dt class="text-slate-500">เวลา API</dt><dd class="mt-0.5 text-slate-200"></dd></div></dl>`;
        const values = row.querySelectorAll('p, span, dd');
        values[0].textContent = summarize(item.payload || {});
        values[1].textContent = time;
        values[2].textContent = motionLabels[item.status] || item.status;
        values[2].className = `rounded-full border px-2 py-1 text-[10px] font-bold ${item.status === 'MQTT_PUBLISHED' ? 'border-emerald-500/40 bg-emerald-950/30 text-emerald-200' : 'border-red-500/40 bg-red-950/30 text-red-200'}`;
        values[3].textContent = item.robot_slug || 'ทุกเครื่อง';
        values[4].textContent = time;
        values[5].textContent = item.source || 'liff';
        values[6].textContent = latency;
        const ack = item.payload?.acknowledgement;
        if (ack?.command_id) {
          const trace = document.createElement('p');
          trace.className = 'mt-3 break-all text-xs text-slate-300';
          trace.textContent = `Command: ${ack.command_id} · ขอ L${ack.requested_speed_level ?? '—'} · cap L${ack.policy_max_speed_level ?? '—'} · ${ack.reject_reason || ack.stop_reason || 'ยังไม่มีหลักฐานความเร็วหรือการหยุดจริง'}`;
          row.appendChild(trace);
          const artifact = document.createElement('p');
          artifact.className = 'mt-1 break-all text-[11px] text-slate-400';
          artifact.textContent = `APK: ${ack.apk_version || item.payload.apk_version || '—'} · SHA256: ${ack.apk_sha256 || item.payload.apk_sha256 || '—'}`;
          row.appendChild(artifact);
        }
        addCommandTrace(row, item.robot_slug,
          item.payload?.command_id || ack?.command_id || item.payload?.envelope?.command_id);
        historyList.appendChild(row);
      });
    }

    async function loadRobots() {
      try {
        const response = await fetch(`${API_BASE}/api/v1/robots`);
        const data = await response.json();
        (data.robots || []).forEach(robot => {
          if (Array.from(robotFilter.options).some(option => option.value === robot.robot_slug)) return;
          const option = document.createElement('option'); option.value = robot.robot_slug; option.textContent = `${robot.robot_slug} · ${robot.client_ip || 'unknown IP'}`; robotFilter.appendChild(option);
        });
      } catch (_) { /* History remains usable without robot discovery. */ }
    }
    function syncLocation() {
      const params = new URLSearchParams();
      if (robotFilter.value) params.set('robot_slug', robotFilter.value);
      if (currentPage > 1) params.set('page', String(currentPage));
      const query = params.toString();
      window.history.replaceState({}, '', `${window.location.pathname}${query ? `?${query}` : ''}`);
    }
    function renderPagination(data) {
      const total = data.total || 0;
      const totalPages = data.total_pages || 1;
      pagination.classList.toggle('hidden', total === 0);
      pagination.classList.toggle('flex', total > 0);
      previousPage.disabled = !data.has_previous;
      nextPage.disabled = !data.has_next;
      pageSummary.textContent = `หน้า ${data.page || 1} จาก ${totalPages} · ${total} รายการ`;
    }
    async function loadHistory(page = currentPage) {
      currentPage = Math.max(1, page);
      historyStatus.textContent = 'กำลังโหลดประวัติ...';
      historyStatus.className = 'mt-3 min-h-5 text-xs text-slate-400';
      try {
        const params = new URLSearchParams({ page: String(currentPage), page_size: String(pageSize) });
        if (robotFilter.value) params.set('robot_slug', robotFilter.value);
        const response = await fetch(`${API_BASE}/api/v1/command-history?${params}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
        if (data.total > 0 && currentPage > data.total_pages) {
          return loadHistory(data.total_pages);
        }
        render(data.items || []);
        renderPagination(data);
        syncLocation();
        const first = data.total ? ((currentPage - 1) * pageSize) + 1 : 0;
        const last = Math.min(currentPage * pageSize, data.total || 0);
        historyStatus.textContent = data.total ? `แสดงรายการ ${first}-${last} จาก ${data.total}` : 'ยังไม่มีคำสั่งที่บันทึกไว้';
      } catch (error) {
        historyList.innerHTML = '';
        pagination.classList.add('hidden');
        pagination.classList.remove('flex');
        historyStatus.textContent = `โหลดประวัติไม่สำเร็จ: ${error.message}`;
        historyStatus.className = 'mt-3 min-h-5 text-xs text-red-300';
      }
    }
    document.getElementById('refresh').addEventListener('click', () => loadHistory());
    robotFilter.addEventListener('change', () => loadHistory(1));
    previousPage.addEventListener('click', () => loadHistory(currentPage - 1));
    nextPage.addEventListener('click', () => loadHistory(currentPage + 1));
    loadRobots();
    robotFilter.value = initialRobotSlug;
    loadHistory();
  </script>
</body>
</html>
