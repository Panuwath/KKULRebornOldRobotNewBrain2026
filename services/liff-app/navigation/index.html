<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Booky Navigation</title><script src="https://cdn.tailwindcss.com"></script><script src="/liff/liff-config.js"></script><script src="/liff/liff.js"></script><style>html{background:#020617}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}</style></head>
<body class="min-h-screen bg-slate-950 p-4 font-sans text-white"><main class="mx-auto max-w-xl space-y-4"><header class="flex items-center justify-between"><a href="/liff/" class="rounded-lg bg-slate-800 px-3 py-2 text-sm font-bold">← หน้าหลัก</a><h1 class="text-lg font-bold">🗺️ นำทาง Booky</h1></header>
<section class="rounded-2xl border border-slate-700 bg-slate-900 p-4"><label class="text-xs">เลือก Zenbo<select id="robot" class="mt-1 min-h-11 w-full rounded-xl bg-slate-950 p-3"></select></label><p id="robot-status" class="mt-2 text-xs text-slate-400">กำลังค้นหา Zenbo...</p></section>
<section class="rounded-2xl border border-slate-700 bg-slate-900 p-4"><p class="text-sm font-bold">จุดเริ่มต้นและปลายทาง</p><p class="mt-1 text-xs text-slate-400">เลือกจากรายการหรือพิมพ์ชื่อสถานที่</p><div class="mt-3 grid gap-3"><label class="text-xs">จาก<input id="from" list="rooms" placeholder="เช่น 1102 หรือ ทางเข้าหลัก" class="mt-1 min-h-11 w-full rounded-xl bg-slate-950 p-3"></label><label class="text-xs">ไป<input id="to" list="rooms" placeholder="เช่น 1401 หรือ ห้องน้ำ" class="mt-1 min-h-11 w-full rounded-xl bg-slate-950 p-3"></label><datalist id="rooms"></datalist><button id="preview" class="min-h-12 rounded-xl bg-violet-600 font-bold">คำนวณเส้นทาง</button></div><p id="status" class="mt-2 text-xs text-slate-400" role="status"></p></section>
<section id="result" hidden class="rounded-2xl border border-emerald-500/30 bg-emerald-950/20 p-4"><h2 class="font-bold text-emerald-200">เส้นทางที่ Zenbo จะแสดงและพูด</h2><p id="summary" class="mt-2 text-sm"></p><p id="speech" class="mt-3 rounded-xl bg-slate-950 p-3 text-sm leading-relaxed"></p><details class="mt-3 text-xs text-slate-300"><summary>ข้อความพูดแต่ละขั้น</summary><ol id="steps" class="mt-2 list-decimal space-y-1 pl-5"></ol></details><button id="send" class="mt-4 min-h-12 w-full rounded-xl bg-emerald-600 font-bold">ยืนยันส่งให้ Zenbo</button></section>
<p class="text-xs text-amber-200">ระบบจะแสดงแผนที่และพูดแนะนำเท่านั้น ไม่สั่งหุ่นยนต์เดินอัตโนมัติ</p></main>
<script>const api=`${location.origin}${window.ZENBO_LIFF_CONFIG?.apiBase||''}`;let robot='',route=null;window.ZenboLiff.init();const status=(m,e=false)=>{const x=document.querySelector('#status');x.textContent=m;x.className=`mt-2 text-xs ${e?'text-red-300':'text-slate-400'}`};async function init(){try{const [rs,ls]=await Promise.all([fetch(`${api}/api/v1/robots`),fetch(`${api}/api/v1/navigation/rooms`)]);const r=await rs.json(),l=await ls.json();document.querySelector('#robot').innerHTML='<option value="">เลือก Zenbo ที่ออนไลน์...</option>'+r.robots.map(x=>`<option value="${x.robot_slug}">${x.robot_slug} · ${x.client_ip||''}</option>`).join('');document.querySelector('#robot-status').textContent=r.robots.length?'เลือก Zenbo ก่อนเริ่ม':'ยังไม่พบ Zenbo ออนไลน์';document.querySelector('#rooms').innerHTML=(l.rooms||[]).map(x=>`<option value="${x.code}">${x.name_th} · ชั้น ${x.floor}</option>`).join('')}catch(e){status(`โหลดข้อมูลไม่สำเร็จ: ${e.message}`,true)}}document.querySelector('#robot').onchange=e=>robot=e.target.value;document.querySelector('#preview').onclick=async()=>{const from=document.querySelector('#from').value.trim(),to=document.querySelector('#to').value.trim();if(!robot)return status('เลือก Zenbo ก่อนคำนวณ',true);if(!from||!to)return status('ระบุจุดเริ่มต้นและปลายทาง',true);status('กำลังคำนวณเส้นทาง...');try{const r=await fetch(`${api}/api/v1/navigation/route?from_location=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);const d=await r.json();if(!r.ok)throw Error(d.detail?.message||'คำนวณไม่สำเร็จ');route=d.route;document.querySelector('#summary').textContent=`${route.start.name_th} → ${route.destination.name_th} · ${route.distance_meters||'?'} เมตร · ${route.estimated_minutes||'?'} นาที`;document.querySelector('#speech').textContent=route.speech_text;document.querySelector('#steps').innerHTML=route.step_speeches.map(x=>`<li>${x}</li>`).join('');document.querySelector('#result').hidden=false;status('ตรวจข้อมูลแล้วกดยืนยันเพื่อเปิดแผนที่และพูด')}catch(e){status(e.message,true)}};document.querySelector('#send').onclick=async()=>{if(!route||!robot)return;const b=document.querySelector('#send');b.disabled=true;b.textContent='กำลังส่ง...';try{const r=await fetch(`${api}/api/v1/robot/interact`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({robot_slug:robot,source:'liff_navigation',...window.ZenboLiff.identity(),text:route.speech_text,face:'HAPPY',navigation:{display_url:route.display_url,speech_text:route.speech_text,step_speeches:route.step_speeches}})});if(!r.ok)throw Error('ส่งไม่สำเร็จ');status('ส่งแล้ว: Zenbo จะเปิดแผนที่และพูดคำแนะนำ')}catch(e){status(e.message,true)}finally{b.disabled=false;b.textContent='ยืนยันส่งให้ Zenbo'}};init()</script></body></html>
