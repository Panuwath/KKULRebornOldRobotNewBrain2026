# Include these locations in the existing HTTPS `server` block for
# libn.kku.ac.th.  The upstream is the Docker host address used by the campus
# Nginx container; adjust only if Core runs on a different host/port.

location = /liff {
    return 301 /liff/;
}

location ^~ /liff/ {
    # No trailing slash: preserve /liff/... for FastAPI StaticFiles.
    proxy_pass http://10.101.118.149:5005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
}

location ^~ /liff-api/ {
    # Core middleware safely maps /liff-api/api/... to /api/....
    proxy_pass http://10.101.118.149:5005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
}

# MQTT over WebSocket (WSS) reverse proxy for Zenbo robot and web clients.
# Upstream is Mosquitto's WebSocket listener on port 9001.
location /mqtt {
    proxy_pass http://10.101.118.149:9001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

