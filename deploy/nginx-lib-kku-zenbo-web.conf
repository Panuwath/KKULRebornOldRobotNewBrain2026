# Install inside the existing `server_name lib.kku.ac.th` block, before the
# general `location /` handler. This serves the Zenbo controller as a normal
# website; it is intentionally separate from the LINE LIFF route on libn.

location = /liff {
    return 301 /liff/;
}

location ^~ /liff/ {
    proxy_pass http://zenbo-core-api:5005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Keep the legacy/direct OIDC entry point on the library host.  Scope this
# narrowly so the host application's other /api/ routes stay untouched.
location ^~ /api/v1/web-auth/ {
    proxy_pass http://zenbo-core-api:5005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

location ^~ /liff-api/ {
    proxy_pass http://zenbo-core-api:5005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

# MQTT over WebSocket (WSS) reverse proxy for Zenbo robot and web clients.
# Proxies to Eclipse Mosquitto's WebSocket listener on port 9001.
location /mqtt {
    proxy_pass http://zenbo-mqtt-broker:9001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

