plugins {
    id 'com.android.application'
}

def buildConfigString = { Object value ->
    '"' + (value ?: '').toString().replace('\\', '\\\\').replace('"', '\\"') + '"'
}
// The device credential is injected only by the secured build environment:
//   ./gradlew -PmqttUsername=zenbo-client -PmqttToken=<per-device-token> :app:assembleRelease
// It must never be committed to Gradle files or source control.
def mqttUsername = project.findProperty('mqttUsername') ?: System.getenv('MQTT_USERNAME') ?: ''
def mqttToken = project.findProperty('mqttToken') ?: System.getenv('MQTT_TOKEN') ?: ''

android {
    namespace 'com.hackathon.zenboclient'
    compileSdk 33

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.hackathon.zenboclient"
        minSdk 23
        targetSdk 33
        versionCode 17
        versionName "1.7.5-mqtt-token"
        buildConfigField "String", "MQTT_USERNAME", buildConfigString(mqttUsername)
        buildConfigField "String", "MQTT_TOKEN", buildConfigString(mqttToken)
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}
